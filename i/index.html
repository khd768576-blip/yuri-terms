<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japanese with Yuri – Friend invite</title>
<meta name="description" content="Join me on Japanese with Yuri and learn Japanese together.">
<style>
:root{--bg:#EEF2EC;--card:#fff;--ink:#1f2a24;--muted:#5d6a63;--line:#d6ddd8;--accent:#2f6f55}
@media (prefers-color-scheme:dark){:root{--bg:#151a17;--card:#1e2521;--ink:#e8eee9;--muted:#a3b0a8;--line:#2f3a34;--accent:#5fae8a}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans KR","Noto Sans JP","Noto Sans Thai","Noto Sans TC",sans-serif}
main{width:min(400px,calc(100% - 32px));background:var(--card);border-radius:24px;padding:28px 20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.mark{width:72px;height:72px;border-radius:20px;background:var(--accent);color:#fff;font-size:40px;font-weight:800;display:grid;place-items:center;margin:0 auto 14px;font-family:"Noto Sans JP",sans-serif}
h1{font-size:20px;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px;line-height:1.6;font-size:15px}
.code{font-size:26px;font-weight:800;letter-spacing:.14em;background:var(--bg);border-radius:14px;padding:12px;margin:0 0 18px}
a.btn{display:block;text-decoration:none;border-radius:14px;padding:14px;font-weight:700;margin-top:10px}
a.pri{background:var(--accent);color:#fff}a.sec{border:2px solid var(--line);color:var(--ink)}
small{display:block;color:var(--muted);margin-top:16px;line-height:1.5}
</style></head><body>
<main><div class="mark">ゆ</div><h1 id="t"></h1><p id="s"></p><a class="btn pri" id="open"></a><a class="btn sec" id="play"></a><small id="n"></small></main>
<script>
const L = {
 en:["You're invited!","A friend wants to learn Japanese with you on Japanese with Yuri. Add each other and compete in weekly leagues.","Open in the app","Get it on Google Play","Installed the app? Tap “Open in the app” again to become friends."],
 ko:["친구 초대가 왔어요!","친구가 Japanese with Yuri에서 같이 일본어 공부하자고 초대했어요. 친구가 되어 주간 리그에서 겨뤄 보세요.","앱에서 열기","Google Play에서 받기","앱을 설치했다면 '앱에서 열기'를 한 번 더 누르면 친구가 돼요."],
 vi:["Bạn được mời!","Một người bạn muốn cùng bạn học tiếng Nhật trên Japanese with Yuri. Hãy kết bạn và thi đấu trong giải hằng tuần.","Mở trong ứng dụng","Tải trên Google Play","Đã cài ứng dụng? Bấm “Mở trong ứng dụng” lần nữa để kết bạn."],
 id:["Kamu diundang!","Seorang teman ingin belajar bahasa Jepang bersamamu di Japanese with Yuri. Berteman dan bersaing di liga mingguan.","Buka di aplikasi","Dapatkan di Google Play","Sudah memasang aplikasi? Ketuk “Buka di aplikasi” lagi untuk berteman."],
 th:["คุณได้รับคำเชิญ!","เพื่อนอยากเรียนภาษาญี่ปุ่นกับคุณที่ Japanese with Yuri มาเป็นเพื่อนกันและแข่งในลีกประจำสัปดาห์","เปิดในแอป","ดาวน์โหลดบน Google Play","ติดตั้งแอปแล้ว? แตะ “เปิดในแอป” อีกครั้งเพื่อเป็นเพื่อนกัน"],
 tl:["Inimbitahan ka!","Gusto ng isang kaibigan na mag-aral ng Japanese kasama ka sa Japanese with Yuri. Maging magkaibigan at maglaban sa lingguhang liga.","Buksan sa app","Kunin sa Google Play","Na-install na ang app? I-tap ulit ang “Buksan sa app” para maging magkaibigan."],
 zt:["你收到好友邀請！","朋友邀請你一起在 Japanese with Yuri 學日文。加為好友，在每週聯賽中一較高下吧。","在 App 中開啟","在 Google Play 下載","已安裝 App？再點一次「在 App 中開啟」就能成為好友。"]};
const want = (navigator.language || "en").toLowerCase(), map = {ko:"ko",vi:"vi",id:"id",in:"id",th:"th",tl:"tl",fil:"tl","zh-tw":"zt","zh-hk":"zt","zh-hant":"zt",zh:"zt"};
const lang = map[want] || map[want.split("-")[0]] || "en", t = L[lang];
document.documentElement.lang = lang === "zt" ? "zh-Hant" : lang;
const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
const PKG = "com.japanesewithyuri.android", play = "https://play.google.com/store/apps/details?id=" + PKG;
const intent = "intent://add/" + code + "#Intent;scheme=jwyuri;package=" + PKG + ";S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
document.getElementById("t").textContent = t[0]; document.getElementById("s").textContent = t[1];
const o = document.getElementById("open"); o.textContent = t[2]; o.href = /android/i.test(navigator.userAgent) ? intent : "jwyuri://add/" + code;
const p = document.getElementById("play"); p.textContent = t[3]; p.href = play;
document.getElementById("n").textContent = t[4];
if (code && /android/i.test(navigator.userAgent)) setTimeout(() => { location.href = intent; }, 400);
</script>
</body></html>
