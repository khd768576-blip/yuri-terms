<script>
const D = {
 en:["English","Delete your Japanese with Yuri account","In the app","Open the app and go to Settings › My account (or Me › My account).","Under Google account, tap Delete and confirm.","Your online profile, friends, league entries and cloud backup are deleted right away. Your Google sign-in record is deleted too.","Without the app","Install the app again, sign in with the same Google account and follow the steps above — or send a deletion request from the e-mail address of your Google account to khd768576@gmail.com. We delete the data within 10 days.","What is deleted / kept","Deleted: nickname, profile picture, friend code, friend list, league results, cloud backup of your progress, and the sign-in account. Kept: nothing on our servers. Purchase records are kept by Google Play as required by law. Study data saved only on your phone stays until you delete the app."],
 ko:["한국어","Japanese with Yuri 계정 삭제","앱에서 삭제하기","앱을 열고 설정 › 내 계정(또는 나 › 내 계정)으로 이동합니다.","Google 계정 항목에서 '삭제'를 누르고 확인합니다.","온라인 프로필, 친구, 리그 기록, 클라우드 백업이 즉시 삭제되고 로그인 계정도 삭제됩니다.","앱이 없을 때","앱을 다시 설치해 같은 Google 계정으로 로그인한 뒤 위 순서대로 삭제하거나, Google 계정 이메일로 khd768576@gmail.com로 삭제를 요청하세요. 10일 이내에 삭제합니다.","삭제되는 정보 / 보관되는 정보","삭제: 닉네임, 프로필 사진, 친구 코드, 친구 목록, 리그 결과, 진도 클라우드 백업, 로그인 계정. 보관: 서버에는 남기지 않습니다. 결제 기록은 법령에 따라 Google Play가 보관합니다. 휴대폰에만 저장된 학습 기록은 앱을 삭제할 때까지 남아 있습니다."],
 vi:["Tiếng Việt","Xóa tài khoản Japanese with Yuri","Trong ứng dụng","Mở ứng dụng, vào Cài đặt › Tài khoản của tôi.","Ở mục Tài khoản Google, bấm Xóa và xác nhận.","Hồ sơ trực tuyến, bạn bè, kết quả giải đấu, bản sao lưu đám mây và tài khoản đăng nhập sẽ bị xóa ngay.","Khi không còn ứng dụng","Cài lại ứng dụng, đăng nhập cùng tài khoản Google rồi làm như trên — hoặc gửi yêu cầu xóa từ email tài khoản Google tới khd768576@gmail.com. Chúng tôi xóa trong vòng 10 ngày.","Dữ liệu bị xóa / được giữ","Xóa: biệt danh, ảnh hồ sơ, mã bạn bè, danh sách bạn, kết quả giải đấu, sao lưu tiến độ, tài khoản đăng nhập. Máy chủ không giữ lại gì. Lịch sử mua hàng do Google Play lưu theo luật. Dữ liệu học chỉ lưu trên điện thoại sẽ còn đến khi bạn gỡ ứng dụng."],
 id:["Bahasa Indonesia","Hapus akun Japanese with Yuri","Di aplikasi","Buka aplikasi, masuk ke Pengaturan › Akun saya.","Di bagian Akun Google, ketuk Hapus lalu konfirmasi.","Profil online, teman, data liga, cadangan cloud, dan akun login langsung dihapus.","Tanpa aplikasi","Pasang lagi aplikasinya, masuk dengan akun Google yang sama lalu ikuti langkah di atas — atau kirim permintaan penghapusan dari email akun Google Anda ke khd768576@gmail.com. Kami menghapusnya dalam 10 hari.","Data yang dihapus / disimpan","Dihapus: nama panggilan, foto profil, kode teman, daftar teman, hasil liga, cadangan progres, akun login. Server kami tidak menyimpan apa pun. Catatan pembelian disimpan Google Play sesuai hukum. Data belajar yang hanya ada di ponsel tetap ada sampai aplikasi dihapus."],
 th:["ไทย","ลบบัญชี Japanese with Yuri","ในแอป","เปิดแอปแล้วไปที่ การตั้งค่า › บัญชีของฉัน","ในส่วนบัญชี Google แตะ ลบ แล้วยืนยัน","โปรไฟล์ออนไลน์ เพื่อน ข้อมูลลีก ข้อมูลสำรองบนคลาวด์ และบัญชีที่ใช้ลงชื่อเข้าใช้จะถูกลบทันที","เมื่อไม่มีแอป","ติดตั้งแอปอีกครั้ง ลงชื่อเข้าใช้ด้วยบัญชี Google เดิมแล้วทำตามขั้นตอนข้างต้น หรือส่งคำขอลบจากอีเมลบัญชี Google ไปที่ khd768576@gmail.com เราจะลบภายใน 10 วัน","ข้อมูลที่ลบ / ที่เก็บไว้","ลบ: ชื่อเล่น รูปโปรไฟล์ โค้ดเพื่อน รายชื่อเพื่อน ผลลีก ข้อมูลสำรองความคืบหน้า และบัญชีลงชื่อเข้าใช้ เซิร์ฟเวอร์ไม่เก็บข้อมูลใดไว้ ประวัติการซื้อเก็บโดย Google Play ตามกฎหมาย ข้อมูลการเรียนที่อยู่ในโทรศัพท์เท่านั้นจะอยู่จนกว่าคุณจะลบแอป"],
 tl:["Filipino","Burahin ang iyong Japanese with Yuri account","Sa app","Buksan ang app at pumunta sa Settings › My account.","Sa ilalim ng Google account, i-tap ang Burahin at kumpirmahin.","Agad na mabubura ang online profile, mga kaibigan, record sa liga, cloud backup at ang sign-in account.","Kung wala nang app","I-install ulit ang app, mag-sign in gamit ang parehong Google account at sundin ang mga hakbang sa itaas — o magpadala ng kahilingan mula sa e-mail ng iyong Google account sa khd768576@gmail.com. Buburahin namin ito sa loob ng 10 araw.","Ano ang nabubura / naiiwan","Nabubura: nickname, profile picture, friend code, listahan ng kaibigan, resulta ng liga, backup ng progress, sign-in account. Walang naiiwan sa aming server. Ang mga record ng pagbili ay itinatago ng Google Play ayon sa batas. Ang data ng pag-aaral na nasa phone lang ay mananatili hanggang burahin mo ang app."],
 zt:["繁體中文","刪除 Japanese with Yuri 帳戶","在 App 中刪除","開啟 App，前往 設定 › 我的帳戶。","在 Google 帳戶項目點「刪除」並確認。","線上個人資料、好友、聯賽紀錄、雲端備份與登入帳戶會立即刪除。","沒有 App 時","重新安裝 App 並以同一個 Google 帳戶登入後依上述步驟刪除，或用 Google 帳戶的電子郵件寄信至 khd768576@gmail.com 提出刪除申請。我們會在 10 天內刪除。","刪除與保留的資料","刪除：暱稱、頭像、好友代碼、好友名單、聯賽結果、進度雲端備份、登入帳戶。伺服器不保留任何資料。購買紀錄依法由 Google Play 保存。只存在手機上的學習紀錄會保留到你移除 App 為止。"]};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nav = document.querySelector("nav"), c = document.getElementById("c");
function pick(l){ const d = D[l]; document.documentElement.lang = l === "zt" ? "zh-Hant" : l;
  c.innerHTML = `<h1>${esc(d[1])}</h1><h2>${esc(d[2])}</h2><ol><li>${esc(d[3])}</li><li>${esc(d[4])}</li></ol><p>${esc(d[5])}</p><h2>${esc(d[6])}</h2><p>${esc(d[7])}</p><h2>${esc(d[8])}</h2><p>${esc(d[9])}</p><p><a href="./">Terms &amp; Privacy</a></p>`;
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.l === l)); }
nav.innerHTML = Object.entries(D).map(([k, v]) => `<button data-l="${k}">${v[0]}</button>`).join("");
nav.querySelectorAll("button").forEach(b => b.onclick = () => pick(b.dataset.l));
const want = (new URLSearchParams(location.search).get("lang") || navigator.language || "en").toLowerCase();
const map = {ko:"ko",vi:"vi",id:"id",in:"id",th:"th",tl:"tl",fil:"tl","zh-tw":"zt","zh-hk":"zt","zh-hant":"zt",zh:"zt"};
pick(map[want] || map[want.split("-")[0]] || "en");
</script></body></html>
